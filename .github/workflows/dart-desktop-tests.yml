name: Dart desktop tests

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner image to execute on.
        required: true
        type: string
      arch:
        description: Architecture to execute on.
        default: x64
        type: string

env:
  REALM_CI: true

jobs:
  dart-tests:
    runs-on: ${{ inputs.runner }}
    name: Dart tests on ${{ inputs.runner }}-${{ inputs.arch }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Check runner.arch
        if: ${{ inputs.arch != runner.arch }}
        run: false # fail if arch is not as expected
        shell: bash

      # No artifact download: the build hook compiles librealm from source
      # for the host target when `dart test` runs.
      - name: Setup Runner
        uses: ./.github/actions/setup-runner

      - name: Bump ulimit on macos
        run: |
          ulimit -n
          ulimit -n 10240
        if: ${{ contains(runner.os, 'macos') }}

      - name: Run tests ${{ runner.os }} ${{ runner.arch }}
        run: melos test:unit

      - name: Run serial-only tests (excluded from the parallel run)
        run: dart test -P serialize
        working-directory: packages/realm

      # TODO: Publish all reports
      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results Dart ${{ runner.os }} ${{ runner.arch }}
          path: test-results.json
          reporter: dart-json
          only-summary: true
          working-directory: packages/realm

      - name: Gather coverage report
        if: inputs.runner == 'ubuntu-latest' && !github.event.pull_request.head.repo.fork
        run: |
          sudo apt-get install lcov
          melos setup
          melos coverage:convert
          melos coverage:gather
          melos coverage:groom

      - name: Publish coverage
        if: inputs.runner == 'ubuntu-latest' && !github.event.pull_request.head.repo.fork
        id: publish-coverage
        uses: coverallsapp/github-action@f350da2c033043742f89e8c0b7b5145a1616da6d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: realm
          path-to-lcov: ./coverage/lcov.info
          parallel: true
