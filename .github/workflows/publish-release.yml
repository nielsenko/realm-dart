name: Publish Release

# Publishes the realm packages to pub.dev. Unlike the old flow there is no
# S3 hosting and no separate realm_dart package: the published `realm`
# package bundles prebuilt native binaries for every target, so consumers
# need no toolchain.
#
# Everything is built on a single macOS runner: it has the Apple SDK (the
# only host-locked dependency), zig cross-compiles Linux (bundled glibc)
# and Windows (bundled mingw) from there, and Android uses the runner's
# NDK. No cross-runner artifact passing.
#
# Publishing uses a PUB_CREDENTIALS secret (the pub.dev uploader's
# ~/.config/dart/pub-credentials.json). Leave `dry-run: true` (default) to
# validate the whole flow - build, package, `pub publish --dry-run` - with
# no secret and no side effects.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate only - no publishing, no GitHub release.
        type: boolean
        default: true

env:
  REALM_CI: true

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    name: Build all targets and publish
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Runner
        # Installs flutter/dart, melos, and the pinned zig (see setup-runner).
        uses: ./.github/actions/setup-runner

      - name: Build native binaries for every target
        working-directory: packages/realm
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -euo pipefail

          # <zig-target> <platform-dir> <libname> [apple-sdk | android]
          build() {
            local target="$1" dir="$2" lib="$3" mode="${4:-}"
            local extra=()
            case "$mode" in
              android) extra=(-Dandroid-ndk="$ANDROID_NDK_HOME") ;;
              ?*)      extra=(--sysroot "$(xcrun --sdk "$mode" --show-sdk-path)") ;;
            esac
            zig build -Dtarget="$target" -Dstrip=true --release=fast "${extra[@]}" -p "zig-out/$dir"
            mkdir -p "binary/$dir"
            local sub=lib; [ "$lib" = "realm_dart.dll" ] && sub=bin
            cp "zig-out/$dir/$sub/$lib" "binary/$dir/$lib"
          }

          # Apple (need the matching SDK sysroot)
          build x86_64-macos          macos-x64           librealm_dart.dylib macosx
          build aarch64-macos         macos-arm64         librealm_dart.dylib macosx
          build aarch64-ios           ios-arm64           librealm_dart.dylib iphoneos
          build aarch64-ios-simulator ios-arm64-simulator librealm_dart.dylib iphonesimulator
          build x86_64-ios-simulator  ios-x64-simulator   librealm_dart.dylib iphonesimulator

          # Desktop (zig bundles glibc / mingw - no sysroot needed)
          build x86_64-linux-gnu      linux-x64     librealm_dart.so
          build aarch64-linux-gnu     linux-arm64   librealm_dart.so
          build x86_64-windows-gnu    windows-x64   realm_dart.dll
          build aarch64-windows-gnu   windows-arm64 realm_dart.dll

          # Android (NDK sysroot)
          build aarch64-linux-android.21 android-arm64 librealm_dart.so android
          build arm-linux-androideabi.21 android-arm   librealm_dart.so android
          build x86_64-linux-android.21  android-x64   librealm_dart.so android

          echo "Bundled native binaries:"
          du -ah binary/*/

      - name: Configure pub credentials
        if: ${{ !inputs.dry-run }}
        run: |
          mkdir -p "$HOME/.config/dart"
          echo '${{ secrets.PUB_CREDENTIALS }}' > "$HOME/.config/dart/pub-credentials.json"

      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        run: melos exec --no-published --no-private -- dart pub publish --dry-run

      - name: Publish to pub.dev
        if: ${{ !inputs.dry-run }}
        # --no-published skips packages whose version is already on pub.dev,
        # so this publishes exactly what changed (realm + any bumped deps).
        run: melos exec --no-published --no-private -- dart pub publish --force

      - name: Read realm version
        id: version
        if: ${{ !inputs.dry-run }}
        run: |
          echo "version=$(sed -ne 's/^version: \(.*\)/\1/p' packages/realm/pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        if: ${{ !inputs.dry-run }}
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        uses: ncipollo/release-action@10c84d509b28aae3903113151bfd832314964f2e
        with:
          bodyFile: release-notes.md
          name: ${{ steps.version.outputs.version }}
          tag: v${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
