name: ejson_generator
description: >-
  EJSON serialization.

  BSON is a binary format used to store JSON-like documents efficiently.
  EJSON extends JSON defining how all BSON types should be represented in JSON.

topics:
  - ejson
  - bson
  - json
  - build-runner
  - codegen

version: 0.4.1
repository: https://github.com/realm/realm-dart/ejson/packages/ejson_generator

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  build: ^4.0.6
  ejson_analyzer: ^0.4.1
  source_gen: ^4.2.3

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.5.15
  dart_style: ^3.1.9
  ejson: ^0.4.1
  ejson_annotation: ^0.4.1
  lints: ^6.0.0
  meta: ^1.18.3
  test: ^1.31.1
  pub_semver: ^2.2.0
