name: ejson_analyzer
description: >-
  Common analysis code for EJSON packages.

  BSON is a binary format used to store JSON-like documents efficiently.
  EJSON extends JSON defining how all BSON types should be represented in JSON.

version: 0.4.1
repository: https://github.com/realm/realm-dart/ejson/packages/ejson_analyzer
publish_to: none # depends on ejson_annotation by path, see below

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  # The analysis server resolves plugins in an isolated synthetic package where
  # workspace resolution does not apply, but path dependencies are followed.
  # Pin to version before publishing
  ejson_annotation:
    path: ../ejson_annotation
  source_gen: ^4.2.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.1
