name: realm_generator
description: >-
  Generates RealmObject classes from Realm data model classes.
  This package is part of the official Realm Flutter and Realm Dart SDKs.

version: 20.2.0

homepage: https://www.realm.io
repository: https://github.com/realm/realm-dart
issue_tracker: https://github.com/realm/realm-dart/issues

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  analyzer: ^8.1.1
  build_resolvers: ^3.0.4
  build: ^4.0.0
  dart_style: ^3.0.1
  realm_common: ^20.2.0
  source_gen: ^4.0.1
  source_span: ^1.8.1
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.5.3
  build_test: ^3.2.1
  lints: ^6.0.0
  logging: ^1.2.0
  meta: ^1.16.0
  path: ^1.9.0
  term_glyph: ^1.2.0
  test: ^1.25.9
  pub_semver: ^2.2.0
