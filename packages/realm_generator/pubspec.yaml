name: realm_generator
description: >-
  Generates RealmObject classes from Realm data model classes.
  This package is part of the official Realm Flutter and Realm Dart SDKs.

version: 20.2.0

homepage: https://www.realm.io
repository: https://github.com/realm/realm-dart
issue_tracker: https://github.com/realm/realm-dart/issues

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  build: ^4.0.6
  dart_style: ^3.1.9
  realm_common: ^20.2.0
  source_gen: ^4.2.3
  source_span: ^1.8.1
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.5.15
  lints: ^6.0.0
  logging: ^1.3.0
  meta: ^1.18.3
  path: ^1.9.1
  term_glyph: ^1.2.0
  test: ^1.31.1
  pub_semver: ^2.2.0
