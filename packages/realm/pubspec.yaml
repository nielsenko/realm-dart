name: realm
description: The official Realm SDK for Dart. Realm is a mobile database - an alternative to SQLite and key-value stores.
version: 20.2.0

homepage: https://www.realm.io
repository: https://github.com/realm/realm-dart
issue_tracker: https://github.com/realm/realm-dart/issues

environment:
  sdk: ^3.11.0
resolution: workspace  

dependencies:
  args: ^2.7.0
  build_cli_annotations: ^2.1.0
  collection: ^1.19.1
  crypto: ^3.0.0
  ejson: ^0.4.1
  ffi: ^2.0.1
  json_annotation: ^4.9.0
  logging: ^1.2.0
  meta: ^1.16.0
  path: ^1.9.0
  realm_common: ^20.2.0
  http: ^1.5.0
  cancellation_token: ^2.0.0
  decimal: ^3.0.1
  rational: ^2.2.3
  type_plus: ^2.1.1
  hooks: ^2.0.2
  code_assets: ^1.2.1

dev_dependencies:
  build_cli: ^2.2.4
  # Dev-time only: used to generate this package's own test/example
  # RealmObject models (see build.yaml). Consumers declare their own
  # dev_dependency on realm_generator + build_runner.
  build_runner: ^2.5.3
  realm_generator: ^20.2.0
  ffigen: ^20.1.1
  json_serializable: ^6.9.2
  lints: ^6.0.0
  test: ^1.25.9
  timezone: ^0.11.0
  universal_platform: ^1.1.0
