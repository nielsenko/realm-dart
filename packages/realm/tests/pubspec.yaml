name: realm_tests
description: A new Flutter project.

publish_to: "none"

version: 2.0.0-alpha.2

# Deliberately NOT part of the pub workspace: this is a Flutter app, and
# including it would make every workspace resolution require a Flutter SDK,
# breaking the pure-Dart `git clone && dart test` flow.
environment:
  sdk: ^3.11.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter
  realm:
    # When depending on this package from a real application you should use:
    #   realm_flutter: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The tests app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

# Resolving standalone means realm's dependencies would come from pub.dev;
# point the ones that live in this repo at their local packages instead.
dependency_overrides:
  realm_common:
    path: ../../realm_common
  ejson:
    path: ../../ejson
  ejson_annotation:
    path: ../../ejson_annotation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  test: ^1.26.1
  timezone: ^0.10.0
  universal_platform: ^1.1.0

flutter:
  assets:
    # test/data is a symlink to the test/data directory in
    # the realm_dart package.
    - test/data/
    - test/data/realm_files/
